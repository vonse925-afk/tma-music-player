<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Midnight Vibe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ===== Цветовые темы ===== */
  :root {
    --bg:#0a0a0a; --card:rgba(24,24,24,.74); --card-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09); --text:#efefef; --muted:#9a9a9f;
    --accent:#b4a7f5; --accent-glow:rgba(180,167,245,0.9); --ink:#14112a;
    --glow-1:#6f4cff; --glow-2:#00c9b7; --glow-3:#ff3f9e;
  }
  body[data-theme="cyber"] {
    --accent:#00ffcc; --accent-glow:rgba(0,255,204,0.9); --ink:#0a1a17;
    --glow-1:#0077ff; --glow-2:#00ffcc; --glow-3:#ff007f;
  }
  body[data-theme="sunset"] {
    --accent:#ff9966; --accent-glow:rgba(255,153,102,0.9); --ink:#26130c;
    --glow-1:#ff5e62; --glow-2:#ff9966; --glow-3:#8a2387;
  }
  body[data-theme="emerald"] {
    --accent:#50c878; --accent-glow:rgba(80,200,120,0.9); --ink:#0c2214;
    --glow-1:#00b09b; --glow-2:#50c878; --glow-3:#96c93d;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); transition: background 0.3s; }
  body {
    color:var(--text); overflow:hidden;
    font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }

  /* ===== Плавная «неоновая лужа» ===== */
  .glow { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; transform:translateZ(0); }
  .glow i {
    position:absolute; width:60vw; height:60vw; max-width:450px; max-height:450px;
    border-radius:50%; filter:blur(55px); opacity:.35; mix-blend-mode:screen;
    animation:flow 14s ease-in-out infinite alternate;
    will-change:transform; transition: background 0.5s;
  }
  .glow i:nth-child(1){ background:var(--glow-1); left:-10%; top:-10%; }
  .glow i:nth-child(2){ background:var(--glow-2); right:-15%; top:30%; animation-duration:18s; animation-delay:-4s; }
  .glow i:nth-child(3){ background:var(--glow-3); left:10%; bottom:-15%; animation-duration:22s; animation-delay:-8s; }
  @keyframes flow {
    0%  { transform:translate(0,0) scale(1); }
    50% { transform:translate(8vw,-6vh) scale(1.1); }
    100%{ transform:translate(-6vw,8vh) scale(.9); }
  }
  .glow::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, transparent 0, var(--bg) 85%); }

  /* ===== Каркас ===== */
  .app {
    position:relative; z-index:1; height:100dvh; max-width:520px; margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);
    display:flex; flex-direction:column; gap:10px;
  }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }

  /* ===== Плеер ===== */
  .now { padding:16px 16px 10px; }
  .row { display:flex; align-items:center; gap:12px; }
  .disc {
    flex:none; width:58px; height:58px; border-radius:50%; border:1px solid var(--line);
    background:radial-gradient(circle,var(--accent) 0 11%,var(--bg) 12% 14%,#1d1d1d 15% 60%,#111 61%);
  }
  .disc.on { animation:spin 7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .meta { min-width:0; flex:1; }
  .title { font-size:17px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:13px; color:var(--muted); margin-top:2px; }
  .pick { flex:none; background:var(--card-2); border:1px solid var(--line); border-radius:14px; padding:10px 14px; font-size:14px; font-weight:600; }
  .pick:active { opacity:.6; }
  #file { display:none; }

  /* Эффект искр и неонового бегунка */
  .seek-box { position: relative; width: 100%; margin: 4px 0; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:26px; margin:0; background:transparent; cursor:pointer; position: relative; z-index: 2; }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.14) var(--p,0%)); }
  input[type=range]::-moz-range-track { height:4px; border-radius:4px; background:rgba(255,255,255,.14); }
  input[type=range]::-moz-range-progress { height:4px; border-radius:4px; background:var(--accent); }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:18px; height:18px; margin-top:-7px; border-radius:50%; background:var(--text); border:0;
    box-shadow: 0 0 10px var(--accent), 0 0 18px var(--accent-glow);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.3); }

  /* Искры на бегунке во время воспроизведения */
  .sparks {
    position: absolute.hidden; top: 11px; left: 0; width: 100%; height: 4px; pointer-events: none; z-index: 1;
  }
  .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px var(--accent), 0 0 10px #fff;
    opacity: 0;
  }
  .playing-sparks .spark { animation: sparkAnim 0.8s infinite ease-out; }
  @keyframes sparkAnim {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx, 15px), var(--ty, -12px)) scale(0); opacity: 0; }
  }

  .times { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .ctrl { display:flex; justify-content:space-between; align-items:center; padding:6px 0 4px; }
  .ctrl button { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; color:var(--muted); }
  .ctrl button.active-mode { color:var(--accent); text-shadow:0 0 8px var(--accent); }
  .ctrl button:active { background:var(--card-2); }
  .ctrl svg { width:22px; height:22px; fill:currentColor; }
  .ctrl .play { width:60px; height:60px; background:var(--text); color:var(--bg); border-radius:50%; }
  .ctrl .play:active { transform:scale(.94); }
  .play .i2, .play.on .i1 { display:none; } .play.on .i2 { display:block; }
  button:disabled { opacity:.3; }

  /* ===== Вкладки (4 штуки: Плейлист, Скорость, Эквалайзер, Цвета) ===== */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); padding:4px; border-radius:999px; position:relative; }
  .tabs .ind { position:absolute; top:4px; bottom:4px; left:4px; width:calc((100% - 8px)/4); background:var(--accent); border-radius:999px; transition:transform .28s cubic-bezier(.3,.9,.3,1); }
  .tabs button { position:relative; z-index:1; padding:10px 0; font-size:12px; font-weight:600; color:var(--muted); border-radius:999px; transition:color .2s; }
  .tabs button.on { color:var(--ink); }

  .panel { flex:1; min-height:0; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .panel[hidden] { display:none; }

  /* ===== Плейлист ===== */
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:28px 10px; line-height:1.5; }
  .pl { list-style:none; margin:0; padding:0; }
  .pl li { display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:14px; font-size:15px; cursor:pointer; }
  .pl li:active { background:var(--card-2); }
  .pl li span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl li::before { content:""; flex:none; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.18); }
  .pl li.cur { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); font-weight:600; }
  .pl li.cur::before { background:var(--accent); box-shadow:0 0 10px var(--accent); }

  /* ===== Настройки темы (Цвета) =====. */
  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .theme-btn {
    padding: 14px; border-radius: 16px; background: var(--card-2); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .theme-btn.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .theme-dot { width: 16px; height: 16px; border-radius: 50%; }

  /* ===== Скорость / эквалайзер ===== */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { flex:1; padding:11px 6px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); font-size:14px; font-weight:600; text-align:center; white-space:nowrap; }
  .chip.on { background:var(--accent); color:var(--ink); border-color:transparent; }
  .lbl { display:flex; justify-content:space-between; font-size:14px; margin-top:6px; }
  .lbl b { color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .note { font-size:12px; color:var(--muted); margin:2px 0 10px; min-height:16px; }
  .sw { display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:14px; }
  .sw input { width:46px; height:28px; appearance:none; -webkit-appearance:none; border-radius:999px; background:rgba(255,255,255,.16); position:relative; transition:background .2s; margin:0; }
  .sw input::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .2s; }
  .sw input:checked { background:var(--accent); } .sw input:checked::after { transform:translateX(18px); background:var(--ink); }

  .bands { display:flex; justify-content:space-between; margin-top:4px; }
  .band { width:19%; text-align:center; font-size:12px; color:var(--muted); }
  .band .v { color:var(--text); font-variant-numeric:tabular-nums; height:16px; }
  .band .sl { position:relative; height:150px; }
  .band input { position:absolute; width:140px; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-90deg); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body data-theme="lavender">
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app">

  <!-- Плеер -->
  <section class="card now">
    <div class="row">
      <div class="disc" id="disc"></div>
      <div class="meta">
        <div class="title" id="title">Трек не выбран</div>
        <div class="sub" id="sub">Добавьте музыку из памяти телефона</div>
      </div>
      <button class="pick" id="pickBtn" type="button">+ Музыка</button>
      <input type="file" id="file" accept="audio/*" multiple>
    </div>
    
    <div class="seek-box">
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0" disabled aria-label="Позиция в треке">
      <div class="sparks" id="sparksContainer"></div>
    </div>

    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    
    <div class="ctrl">
      <button id="modeBtn" type="button" title="Режим воспроизведения" aria-label="Режим">
        <svg id="modeIcon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
      <button id="prev" type="button" disabled aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.25.66L9.5 12.66a.8.8 0 0 1 0-1.32l9.25-6.5A.8.8 0 0 1 20 5.5z"/></svg></button>
      <button class="play" id="play" type="button" disabled aria-label="Играть / пауза">
        <svg class="i1" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="i2" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
      </button>
      <button id="next" type="button" disabled aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.25.66l9.25-6.5a.8.8 0 0 0 0-1.32L5.25 4.84A.8.8 0 0 0 4 5.5z"/></svg></button>
      <div style="width:42px;"></div>
    </div>
  </section>

  <!-- Вкладки (4 раздела) -->
  <nav class="card tabs" id="tabs">
    <div class="ind" id="ind"></div>
    <button type="button" data-tab="list" class="on">Плейлист</button>
    <button type="button" data-tab="speed">Скорость</button>
    <button type="button" data-tab="eq">Эквалайзер</button>
    <button type="button" data-tab="theme">Цвета</button>
  </nav>

  <!-- Плейлист -->
  <section class="card panel" id="p-list">
    <div class="empty" id="empty">Плейлист пуст.<br>Нажмите «+ Музыка» и выберите файлы.</div>
    <ul class="pl" id="pl"></ul>
  </section>

  <!-- Скорость и тон -->
  <section class="card panel" id="p-speed" hidden>
    <div class="chips" id="speedChips">
      <button class="chip on" type="button" data-p="original">Original</button>
      <button class="chip" type="button" data-p="speed">Speed Up</button>
      <button class="chip" type="button" data-p="slowed">Slowed</button>
    </div>
    <div class="lbl"><span>Скорость</span><b id="rateV">×1.00</b></div>
    <input type="range" id="rate" min="0.5" max="2" step="0.01" value="1" aria-label="Скорость">
    <div class="note" id="pitchNote"></div>
    <div class="sw"><span>Сохранять тон при смене скорости</span><input type="checkbox" id="keep" checked></div>
    <div class="lbl"><span>Реверберация</span><b id="revV">0%</b></div>
    <input type="range" id="rev" min="0" max="100" step="1" value="0" aria-label="Реверберация">
  </section>

  <!-- Эквалайзер -->
  <section class="card panel" id="p-eq" hidden>
    <div class="chips" id="eqChips">
      <button class="chip on" type="button" data-p="default">Default</button>
      <button class="chip" type="button" data-p="bass">Bass Boost</button>
      <button class="chip" type="button" data-p="treble">Treble</button>
      <button class="chip" type="button" data-p="custom">Custom</button>
    </div>
    <div class="bands" id="bands"></div>
  </section>

  <!-- Раздел «Цвета» (Выбор тем) -->
  <section class="card panel" id="p-theme" hidden>
    <div style="font-size:15px; font-weight:600; margin-bottom:12px;">Тема интерфейса</div>
    <div class="theme-grid" id="themeGrid">
      <button class="theme-btn active" data-theme="lavender" type="button">
        <span class="theme-dot" style="background:#b4a7f5;"></span>Лаванда
      </button>
      <button class="theme-btn" data-theme="cyber" type="button">
        <span class="theme-dot" style="background:#00ffcc;"></span>Киберпанк
      </button>
      <button class="theme-btn" data-theme="sunset" type="button">
        <span class="theme-dot" style="background:#ff9966;"></span>Закат
      </button>
      <button class="theme-btn" data-theme="emerald" type="button">
        <span class="theme-dot" style="background:#50c878;"></span>Изумруд
      </button>
    </div>
  </section>
</main>

<script>
/* ===== Telegram Mini App ===== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0a0a0a'); tg.setBackgroundColor('#0a0a0a'); } catch (e) {} }
const buzz = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const $ = id => document.getElementById(id);

/* Смена тем интерфейса */
$('themeGrid').addEventListener('click', e => {
  const btn = e.target.closest('.theme-btn');
  if (!btn) return;
  const theme = btn.dataset.theme;
  document.body.setAttribute('data-theme', theme);
  $('themeGrid').querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b === btn));
  try { localStorage.setItem('midnight_theme', theme); } catch(e){}
  buzz();
});
// Загрузка сохраненной темы
try {
  const savedTheme = localStorage.getItem('midnight_theme');
  if (savedTheme) {
    document.body.setAttribute('data-theme', savedTheme);
    const btn = $(
      'themeGrid'
    ).querySelector(`[data-theme="${savedTheme}"]`);
    if (btn) {
      $('themeGrid').querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b === btn));
    }
  }
} catch(e){}

let playMode = 'list';
const modeIcons = {
  list: '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
  loop: '<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>',
  shuffle: '<path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>'
};

$('modeBtn').onclick = () => {
  if (playMode === 'list') { playMode = 'loop'; $('modeBtn').title = 'Цикл трека'; }
  else if (playMode === 'loop') { playMode = 'shuffle'; $('modeBtn').title = 'Случайный порядок'; }
  else { playMode = 'list'; $('modeBtn').title = 'По порядку'; }
  $('modeIcon').innerHTML = modeIcons[playMode];
  $('modeBtn').classList.toggle('active-mode', playMode !== 'list');
  buzz();
};

/* ===== Настройки пресетов ===== */
const SPEED = {
  original: { rate: 1.0,  keep: true,  rev: 0 },
  speed:    { rate: 1.25, keep: true,  rev: 0 },
  slowed:   { rate: 0.85, keep: false, rev: 30 }
};
const BANDS = [
  { f: 60,    t: 'lowshelf',  n: '60 Гц' },
  { f: 230,   t: 'peaking',   n: '230 Гц' },
  { f: 910,   t: 'peaking',   n: '910 Гц' },
  { f: 3600,  t: 'peaking',   n: '3.6 кГц' },
  { f: 14000, t: 'highshelf', n: '14 кГц' }
];
const EQ = { default: [0,0,0,0,0], bass: [9,5,0,-1,0], treble: [0,0,0,5,9] };

const st = { rate: 1, keep: true, rev: 0 };
const gains = [0,0,0,0,0];

const audio = new Audio();
audio.preload = 'auto';
let ctx, filters = [], dry, wet, conv;

function impulse(c, sec = 2.0, decay = 2.0) {
  const n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decay); }
  return b;
}
function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaElementSource(audio);
  filters = BANDS.map((b, i) => { const f = ctx.createBiquadFilter(); f.type = b.t; f.frequency.value = b.f; if (b.t === 'peaking') f.Q.value = 1; f.gain.value = gains[i]; return f; });
  src.connect(filters[0]);
  filters.reduce((a, b) => (a.connect(b), b));
  dry = ctx.createGain(); wet = ctx.createGain(); conv = ctx.createConvolver(); conv.buffer = impulse(ctx);
  const master = ctx.createGain(); master.gain.value = 0.9;
  const last = filters[filters.length - 1];
  last.connect(dry); last.connect(conv); conv.connect(wet); dry.connect(master); wet.connect(master); master.connect(ctx.destination);
  applyAudio();
}
function applyAudio() {
  audio.defaultPlaybackRate = st.rate;
  audio.playbackRate = st.rate;
  audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = st.keep;
  if (ctx) {
    const w = st.rev / 100, t = ctx.currentTime;
    wet.gain.setTargetAtTime(w, t, 0.12);
    dry.gain.setTargetAtTime(1 - w * 0.35, t, 0.12);
  }
}

/* ===== Вкладки (4 штуки) ===== */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  const ids = ['list', 'speed', 'eq', 'theme'];
  ids.forEach(id => $('p-' + id).hidden = id !== b.dataset.tab);
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('ind').style.transform = `translateX(${ids.indexOf(b.dataset.tab) * 100}%)`;
  buzz();
});

/* ===== Плейлист ===== */
let tracks = [], idx = -1;
const AUDIO_RE = /\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|weba|wma)$/i;
const nameOf = f => f.name.replace(/\.[^.]+$/, '');

$('pickBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const list = [...e.target.files].filter(f => f.type.startsWith('audio') || AUDIO_RE.test(f.name));
  e.target.value = ''; 
  if (!list.length) return;
  const firstTimeEmpty = tracks.length === 0;
  tracks.push(...list);
  renderList();
  if (firstTimeEmpty) loadTrack(0, false);
  $('prev').disabled = $('next').disabled = false;
  buzz();
};

function renderList() {
  const ul = $('pl'), frag = document.createDocumentFragment();
  tracks.forEach((f, i) => { 
    const li = document.createElement('li'); 
    li.dataset.i = i; 
    const s = document.createElement('span'); 
    s.textContent = nameOf(f); 
    li.append(s); 
    frag.append(li); 
  });
  ul.replaceChildren(frag);
  $('empty').hidden = tracks.length > 0;
  markCurrent();
}
function markCurrent() {
  [...$('pl').children].forEach((li, i) => li.classList.toggle('cur', i === idx));
  const el = $('pl').children[idx]; if (el) el.scrollIntoView({ block: 'nearest' });
}
$('pl').addEventListener('click', e => { const li = e.target.closest('li'); if (li) { loadTrack(+li.dataset.i, true); buzz(); } });

let url = '';
function loadTrack(i, autoplay) {
  idx = i;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(tracks[i]);
  audio.src = url;
  applyAudio();
  $('title').textContent = nameOf(tracks[i]);
  $('sub').textContent = `Трек ${i + 1} раз из ${tracks.length}`.replace('раз', 'из');
  $('seek').disabled = $('play').disabled = false;
  $('seek').value = 0; paintSeek(); $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
  markCurrent();
  mediaSession(tracks[i]);
  if (autoplay) play();
}
async function play() {
  initAudio();
  if (ctx.state === 'suspended') await ctx.resume();
  try { await audio.play(); } catch (e) { $('sub').textContent = 'Ошибка воспроизведения'; }
}

function getNextIndex() {
  if (playMode === 'shuffle') {
    if (tracks.length <= 1) return idx;
    let next;
    do { next = Math.floor(Math.random() * tracks.length); } while (next === idx);
    return next;
  }
  return (idx + 1) % tracks.length;
}

const step = d => {
  if (!tracks.length) return;
  if (playMode === 'shuffle' && d > 0) {
    loadTrack(getNextIndex(), true);
  } else {
    loadTrack((idx + d + tracks.length) % tracks.length, true);
  }
};

$('prev').onclick = () => { step(-1); buzz(); };
$('next').onclick = () => { step(1); buzz(); };
$('play').onclick = () => { audio.paused ? play() : audio.pause(); buzz(); };

function setOn(on) { 
  $('play').classList.toggle('on', on); 
  $('disc').classList.toggle('on', on);
  $('seek').parentNode.classList.toggle('playing-sparks', on);
}
audio.onplay = () => setOn(true);
audio.onpause = () => setOn(false);

audio.onended = () => {
  if (playMode === 'loop') {
    audio.currentTime = 0;
    play();
  } else if (playMode === 'shuffle') {
    loadTrack(getNextIndex(), true);
  } else {
    if (idx < tracks.length - 1) step(1); else { loadTrack(0, true); audio.pause(); setOn(false); }
  }
};
audio.onerror = () => { $('sub').textContent = 'Формат не поддерживается'; };

function mediaSession(f) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: nameOf(f), artist: 'Midnight Vibe' });
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  } catch (e) {}
}

/* ===== Генерация искр на бегунке ===== */
const sparksContainer = $('sparksContainer');
function spawnSpark() {
  if (audio.paused || !audio.duration) return;
  const spark = document.createElement('div');
  spark.className = 'spark';
  const posPercent = seek.value;
  spark.style.left = posPercent + '%';
  const tx = (Math.random() - 0.5) * 30 + 'px';
  const ty = (-10 - Math.random() * 20) + 'px';
  spark.style.setProperty('--tx', tx);
  spark.style.setProperty('--ty', ty);
  sparksContainer.appendChild(spark);
  setTimeout(() => spark.remove(), 800);
}
setInterval(spawnSpark, 120);

/* ===== Таймлайн ===== */
const paintRange = (el) => {
  const min = +el.min || 0;
  const max = +el.max || 100;
  const val = +el.value;
  const percent = ((val - min) / (max - min)) * 100;
  el.style.setProperty('--p', percent + '%');
};

const seek = $('seek'); let drag = false;
const paintSeek = () => paintRange(seek);

audio.onloadedmetadata = () => { $('dur').textContent = fmt(audio.duration); applyAudio(); };
audio.ontimeupdate = () => { 
  if (drag || !audio.duration) return; 
  seek.value = (audio.currentTime / audio.duration) * 100; 
  $('cur').textContent = fmt(audio.currentTime); 
  paintSeek(); 
};

seek.oninput = () => { 
  drag = true; 
  if(audio.duration) {
    $('cur').textContent = fmt((seek.value / 100) * audio.duration); 
  }
  paintSeek(); 
};
seek.onchange = () => { 
  if(audio.duration) {
    audio.currentTime = (seek.value / 100) * audio.duration; 
  }
  drag = false; 
};

const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

/* ===== Скорость / тон / реверберация ===== */
function syncSpeedUI(activePreset) {
  $('rate').value = st.rate; 
  $('keep').checked = st.keep; 
  $('rev').value = st.rev;
  
  $('rateV').textContent = '×' + st.rate.toFixed(2);
  $('revV').textContent = st.rev + '%';
  
  const semi = 12 * Math.log2(st.rate);
  $('pitchNote').textContent = st.keep ? 'Тон не меняется' : `Тон ${semi >= 0 ? '+' : '−'}${Math.abs(semi).toFixed(1)} полутона`;
  
  if (activePreset) {
    $('speedChips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.p === activePreset));
  }
  
  paintRange($('rate'));
  paintRange($('rev'));
  applyAudio();
}

$('speedChips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  Object.assign(st, SPEED[c.dataset.p]); 
  syncSpeedUI(c.dataset.p); 
  buzz();
});

$('rate').oninput = e => { 
  st.rate = +e.target.value; 
  syncSpeedUI(null); 
  $('speedChips').querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
};
$('keep').onchange = e => { st.keep = e.target.checked; syncSpeedUI(null); };
$('rev').oninput = e => { st.rev = +e.target.value; syncSpeedUI(null); };

syncSpeedUI('original');

/* ===== Эквалайзер ===== */
const sliders = BANDS.map((b, i) => {
  const d = document.createElement('div'); d.className = 'band';
  d.innerHTML = `<div class="v">0</div><div class="sl"><input type="range" min="-12" max="12" step="1" value="0" aria-label="${b.n}"></div><div>${b.n}</div>`;
  $('bands').append(d);
  const r = d.querySelector('input'), v = d.querySelector('.v');
  r.oninput = () => { 
    gains[i] = +r.value; 
    setGain(i); 
    v.textContent = (r.value > 0 ? '+' : '') + r.value; 
    setEqChip('custom'); 
    paintRange(r); 
  };
  paintRange(r);
  return { r, v };
});
function setGain(i) { if (filters[i]) filters[i].gain.setTargetAtTime(gains[i], ctx.currentTime, 0.05); }
function setEqChip(p) { $('eqChips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.p === p)); }
$('eqChips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.dataset.p !== 'custom') EQ[c.dataset.p].forEach((g, i) => {
    gains[i] = g; sliders[i].r.value = g; sliders[i].v.textContent = (g > 0 ? '+' : '') + g; paintRange(sliders[i].r); setGain(i);
  });
  setEqChip(c.dataset.p); buzz();
});
</script>
</body>
